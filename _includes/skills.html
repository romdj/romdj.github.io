{% assign skills = data.skills %}
{% if skills and skills.display %}
<section class="section skills-section">

    <div class="section-title">
        {{ skills.title }}
    </div>

    <dl class="capabilities-list">
        {% for group in skills.groups %}
        <dt class="capability-name">{{ group.name }}</dt>
        <dd class="capability-detail">{{ group.detail | markdownify }}</dd>
        {% endfor %}
    </dl>

</section>
{% endif %}
