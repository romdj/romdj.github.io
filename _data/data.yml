        Set **group-wide architecture governance** at Belgium's national TSO: API and messaging standards in force across **~100 engineering teams, ~50 applications, ~70 data products**, plus **fitness functions** defining minimum architecture-quality thresholds.
    - bullet: |
        Authored the **long-term vision for Belgium's national TSO Customer Centricity Platform**. Translated cross-cutting platform architecture into product-line strategy across **multiple business units, 20+ product lines, 10 scrum teams**. Ratified at the Architecture Review Board.
    - bullet: |
        **Architecture lead for a 12-person Nike team** at the EMEA distribution hub (Laakdal, multi-million daily events at peak). Deconstructed a 15-year-old monolith; migrated to Centiro and then Blue Yonder. Daily delivery with on-call accountability.
    - bullet: |
        Backend platform contributor at **Philips HealthSuite Digital Platform**, one of the first medically-compliant cloud platforms (FHIR, HIPAA, FMEA-governed), **1B+ device connections per year**.
    - bullet: |
