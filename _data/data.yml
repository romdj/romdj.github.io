  items:
    - bullet: |
        Authored the **group-level IAM Architecture Vision** at Belgium's national TSO. Unified 3 fragmented identity stacks and 5 authorization mechanisms for **300+ external market participants** across Belgium and Germany, anchored in NIS2, DORA, and eIDAS 2.0. Ratified at the Architecture Review Board (Business, CIO, CISO, Group Architecture); multi-year roadmap now in delivery.
